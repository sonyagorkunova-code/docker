services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      - GREETING=${GREETING:-Hello from Compose}
      - STORAGE=redis
      - REDIS_URL=redis://redis:6379/0
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  counter-data:
  redis-data: